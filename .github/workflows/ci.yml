name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lambda
    uses: ./.github/workflows/_build.yml

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: fmt, validate e guard de segredo
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra fmt -check -recursive -diff
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate -no-color
          # Referencias a variaveis sensiveis (por exemplo, var.jwt_secret) sao
          # esperadas. O guard bloqueia somente valores literais.
          if find infra -type f \( -name '*.tf' -o -name '*.tfvars' \) -print0 \
            | xargs -0 grep -nE "(JWT_SECRET|DB_PASSWORD|AWS_(ACCESS_KEY_ID|SECRET_ACCESS_KEY|SESSION_TOKEN))[[:space:]]*=[[:space:]]*['\"]" >/dev/null; then
            echo '::error::Segredo ou credencial literal encontrado em arquivo Terraform.' >&2
            exit 1
          fi
